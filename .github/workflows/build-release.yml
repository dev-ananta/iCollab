name: Build & Release DMG

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger from Actions tab

jobs:
  build-arm64:
    runs-on: macos-latest  # arm64 runner
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for arm64
        run: swift build -c release

      - name: Locate binary
        id: binary
        run: |
          BINARY=".build/release/iCollab"
          echo "binary=$BINARY" >> $GITHUB_OUTPUT

      - name: Remove quarantine attribute
        run: |
          xattr -d com.apple.quarantine ${{ steps.binary.outputs.binary }} || true

      - name: Create app bundle
        id: bundle
        run: |
          BINARY="${{ steps.binary.outputs.binary }}"
          APP_BUNDLE="iCollab.app"
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"

          cp "$BINARY" "$APP_BUNDLE/Contents/MacOS/iCollab"
          cp Info.plist "$APP_BUNDLE/Contents/"
          cp icon.icns "$APP_BUNDLE/Contents/Resources/"
          echo -n "APPL????" > "$APP_BUNDLE/Contents/PkgInfo"

          echo "bundle=$APP_BUNDLE" >> $GITHUB_OUTPUT

      - name: Create DMG
        id: dmg
        run: |
          APP_BUNDLE="${{ steps.bundle.outputs.bundle }}"
          DMG_NAME="iCollab-arm64.dmg"
          TEMP_DIR="dmg-temp"
          
          mkdir -p "$TEMP_DIR"
          cp -r "$APP_BUNDLE" "$TEMP_DIR/"
          ln -s /Applications "$TEMP_DIR/Applications"
          
          hdiutil create \
            -volname "iCollab" \
            -srcfolder "$TEMP_DIR" \
            -ov \
            -format UDZO \
            "$DMG_NAME"
          
          rm -rf "$TEMP_DIR"
          echo "dmg=$DMG_NAME" >> $GITHUB_OUTPUT

      - name: Verify DMG
        run: |
          hdiutil verify ${{ steps.dmg.outputs.dmg }}
          ls -lh ${{ steps.dmg.outputs.dmg }}

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: iCollab-dmg-arm64
          path: ${{ steps.dmg.outputs.dmg }}
          retention-days: 30

  build-x86_64:
    runs-on: macos-latest  # x86_64 runner (Intel)
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for x86_64
        run: swift build -c release

      - name: Locate binary
        id: binary
        run: |
          BINARY=".build/release/iCollab"
          echo "binary=$BINARY" >> $GITHUB_OUTPUT

      - name: Remove quarantine attribute
        run: |
          xattr -d com.apple.quarantine ${{ steps.binary.outputs.binary }} || true

      - name: Create app bundle
        id: bundle
        run: |
          BINARY="${{ steps.binary.outputs.binary }}"
          APP_BUNDLE="iCollab.app"
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"

          cp "$BINARY" "$APP_BUNDLE/Contents/MacOS/iCollab"
          cp Info.plist "$APP_BUNDLE/Contents/"
          cp icon.icns "$APP_BUNDLE/Contents/Resources/"
          echo -n "APPL????" > "$APP_BUNDLE/Contents/PkgInfo"
          
          echo "bundle=$APP_BUNDLE" >> $GITHUB_OUTPUT

      - name: Create DMG
        id: dmg
        run: |
          APP_BUNDLE="${{ steps.bundle.outputs.bundle }}"
          DMG_NAME="iCollab-x86_64.dmg"
          TEMP_DIR="dmg-temp"
          
          mkdir -p "$TEMP_DIR"
          cp -r "$APP_BUNDLE" "$TEMP_DIR/"
          ln -s /Applications "$TEMP_DIR/Applications"
          
          hdiutil create \
            -volname "iCollab" \
            -srcfolder "$TEMP_DIR" \
            -ov \
            -format UDZO \
            "$DMG_NAME"
          
          rm -rf "$TEMP_DIR"
          echo "dmg=$DMG_NAME" >> $GITHUB_OUTPUT

      - name: Verify DMG
        run: |
          hdiutil verify ${{ steps.dmg.outputs.dmg }}
          ls -lh ${{ steps.dmg.outputs.dmg }}

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: iCollab-dmg-x86_64
          path: ${{ steps.dmg.outputs.dmg }}
          retention-days: 30

  create-release:
    needs: [build-arm64, build-x86_64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "*.dmg" -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
